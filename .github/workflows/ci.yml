name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Syntax check
        run: python -m compileall -q main.py tests
      - name: Run tests
        run: python tests/run_all.py
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: test_logs/
          if-no-files-found: ignore

  build-exe:
    permissions:
      contents: write
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $src = Get-Content main.py -Raw -Encoding UTF8
          $m = [regex]::Match($src, '(?m)^__version__\s*=\s*"([^"]+)"')
          if (-not $m.Success) { throw "__version__ not found in main.py" }
          $expected = "v" + $m.Groups[1].Value
          if ($env:TAG_NAME -ne $expected) {
            throw ("Tag '{0}' does not match main.py __version__ ('{1}'). Bump __version__/CHANGELOG or retag." -f $env:TAG_NAME, $expected)
          }
          Write-Host ("tag {0} matches __version__ {1}" -f $env:TAG_NAME, $expected)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean mplayer.spec
      - name: Verify frozen exe
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/run_all.py p8_exe
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          "INNO_SETUP=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python tools/make_installer.py
      - name: Verify installer
        run: python tests/run_all.py p15_installer
      - name: Sign Windows binaries (OV certificate)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          CODE_SIGN_PFX: ${{ secrets.CODE_SIGN_PFX }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGN_PFX)) {
            Write-Host "No CODE_SIGN_PFX secret; skipping signing."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'mplayer-code-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGN_PFX))
          $signTool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw 'signtool.exe not found' }
          $targets = @()
          $targets += (Get-ChildItem dist\installer\mplayer-setup-*.exe).FullName
          $targets += (Join-Path (Get-Location) 'dist\mplayer\mplayer.exe')
          & $signTool.FullName sign /f $pfx /p $env:CODE_SIGN_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $targets
          if ($LASTEXITCODE -ne 0) { throw "signtool failed: $LASTEXITCODE" }
          & $signTool.FullName verify /pa /q $targets
          if ($LASTEXITCODE -ne 0) { throw "signature verify failed: $LASTEXITCODE" }
          Remove-Item $pfx -Force
      - name: Upload portable build
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: mplayer-windows
          path: dist/mplayer/
      - name: Upload installer
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: mplayer-installer
          path: dist/installer/*.exe


  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download portable build
        uses: actions/download-artifact@v7
        with:
          name: mplayer-windows
          path: release/mplayer
      - name: Download installer
        uses: actions/download-artifact@v7
        with:
          name: mplayer-installer
          path: release/installer
      - name: Package zip
        run: |
          mkdir -p dist
          cd release/mplayer
          zip -qr ../../dist/mplayer-windows-${GITHUB_REF_NAME}.zip .
          ZIP="$GITHUB_WORKSPACE/dist/mplayer-windows-${GITHUB_REF_NAME}.zip"
          sha256sum "$ZIP" | awk '{print $1}' > "$ZIP.sha256"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/mplayer-windows-${{ github.ref_name }}.zip
            dist/mplayer-windows-${{ github.ref_name }}.zip.sha256
            release/installer/mplayer-setup-*.exe
          generate_release_notes: true
          draft: false
