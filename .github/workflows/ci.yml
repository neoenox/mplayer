name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Syntax check
        run: python -m compileall -q main.py tests
      - name: Run tests
        run: python tests/run_all.py
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: test_logs/
          if-no-files-found: ignore

  build-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean mplayer.spec
      - name: Verify frozen exe
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/run_all.py p8_exe
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          "INNO_SETUP=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python tools/make_installer.py
      - name: Verify installer
        run: python tests/run_all.py p15_installer
      - name: Upload portable build
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: mplayer-windows
          path: dist/mplayer/
      - name: Upload installer
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: mplayer-installer
          path: dist/installer/*.exe
      - name: Package zip
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path dist/mplayer/* -DestinationPath "dist/mplayer-windows-${{ github.ref_name }}.zip"
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/mplayer-windows-${{ github.ref_name }}.zip
            dist/installer/mplayer-setup-*.exe
          generate_release_notes: true
          draft: false

